[project]
name = "churn"
version = "0.1.0"
description = "Payment churn prediction - testing/learning ML project"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "shap>=0.44",
    "joblib>=1.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "faker>=25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
